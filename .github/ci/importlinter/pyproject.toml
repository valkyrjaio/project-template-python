[project]
name = "valkyrja-template-ci-importlinter"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["import-linter>=2.15,<3"]

[tool.uv]
# Environment-only project: install the tool, never build this directory.
package = false

# import-linter enforces module boundaries. The root poe task sets PYTHONPATH=src
# so `valkyrja.template` is importable.
[tool.importlinter]
root_packages = ["valkyrja.template"]
include_external_packages = true

# Sindri is a build tool and never a runtime dependency of the template.
[[tool.importlinter.contracts]]
name = "The template does not import sindri"
type = "forbidden"
source_modules = ["valkyrja.template"]
forbidden_modules = ["sindri"]
